# Application
server:
  port: 8080

spring:
  application:
    name: Payment Processor

  # PostgreSQL
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/payflow
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # Connection Pool (HikariCP)
#  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA / Hibernate
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Redis
  data:
    redis:
      host: localhost
      port: 6379
      password:
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1

  # Cache
  cache:
    type: redis
    redis:
      time-to-live: 300000
      cache-null-values: false

  # Thymeleaf
  thymeleaf:
    cache: false
    enabled: true
    prefix: classpath:/templates/
    suffix: .html

# Logging
logging:
  level:
    com.payments: DEBUG
    org.springframework.cache: DEBUG
    org.springframework.data.redis: INFO
